name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          stage="smtp-probe-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/smtp-probe" "$stage/"
          strip "$stage/smtp-probe" || true
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -czf "smtp-probe-${{ matrix.target }}.tar.gz" "$stage"
          sha256sum "smtp-probe-${{ matrix.target }}.tar.gz" > "smtp-probe-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "smtp-probe-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/smtp-probe.exe" $stage
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $stage
          Compress-Archive -Path $stage -DestinationPath "smtp-probe-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "smtp-probe-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  smtp-probe-${{ matrix.target }}.zip" | Out-File -Encoding ascii "smtp-probe-${{ matrix.target }}.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: smtp-probe-${{ matrix.target }}
          path: |
            smtp-probe-${{ matrix.target }}.${{ matrix.archive }}
            smtp-probe-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate-release-notes: true
          draft: false
          prerelease: false
          files: |
            dist/smtp-probe-*.tar.gz
            dist/smtp-probe-*.tar.gz.sha256
            dist/smtp-probe-*.zip
            dist/smtp-probe-*.zip.sha256
