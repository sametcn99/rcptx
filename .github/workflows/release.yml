name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          stage="rcptx-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/rcptx" "$stage/"
          strip "$stage/rcptx" || true
          cp README.md LICENSE "$stage/"
          tar -czf "rcptx-${{ matrix.target }}.tar.gz" "$stage"
          sha256sum "rcptx-${{ matrix.target }}.tar.gz" > "rcptx-${{ matrix.target }}.tar.gz.sha256"

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "rcptx-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rcptx.exe" $stage
          Copy-Item README.md, LICENSE $stage
          Compress-Archive -Path $stage -DestinationPath "rcptx-${{ matrix.target }}.zip" -Force
          $hash = (Get-FileHash "rcptx-${{ matrix.target }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  rcptx-${{ matrix.target }}.zip" | Out-File -Encoding ascii "rcptx-${{ matrix.target }}.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: rcptx-${{ matrix.target }}
          path: |
            rcptx-${{ matrix.target }}.${{ matrix.archive }}
            rcptx-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify checksums
        working-directory: dist
        run: |
          ls -la
          sha256sum --check *.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate-release-notes: true
          draft: false
          prerelease: false
          files: |
            dist/rcptx-*.tar.gz
            dist/rcptx-*.tar.gz.sha256
            dist/rcptx-*.zip
            dist/rcptx-*.zip.sha256
